services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ooi}
      POSTGRES_USER: ${POSTGRES_USER:-ooi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ooi}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ooi} -d ${POSTGRES_DB:-ooi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks.celery_app.celery worker --loglevel=INFO
    volumes: ["./backend:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  scheduler:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks.celery_app.celery beat --loglevel=INFO
    volumes: ["./backend:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  postgres_data:
